<rect x="50" y="210" width="350" height="40" class="task-notify"/>
<text x="225" y="235" text-anchor="middle">Generate tinc-up script</text>
<rect x="50" y="265" width="350" height="40" class="task-notify"/>
<text x="225" y="290" text-anchor="middle">Generate tinc-down script</text>
<rect x="50" y="320" width="350" height="40" class="task-notify"/>
