<rect x="800" y="150" width="350" height="50" class="handler"/>
<text x="975" y="172" text-anchor="middle" font-weight="bold">restart tinc</text>
<text x="975" y="188" text-anchor="middle" font-size="11" fill="#666">Restart tinc@{netname} service</text>
<rect x="800" y="220" width="350" height="50" class="handler"/>
<text x="975" y="242" text-anchor="middle" font-weight="bold">reload tinc</text>
<text x="975" y="258" text-anchor="middle" font-size="11" fill="#666">Reload tinc@{netname} service</text>
<rect x="800" y="290" width="350" height="50" class="handler"/>
<text x="975" y="312" text-anchor="middle" font-weight="bold">Reload sysctl</text>
<text x="975" y="328" text-anchor="middle" font-size="11" fill="#666">Apply sysctl configuration</text>
<rect x="800" y="360" width="350" height="50" class="handler"/>
<text x="975" y="382" text-anchor="middle" font-weight="bold">start tinc</text>
