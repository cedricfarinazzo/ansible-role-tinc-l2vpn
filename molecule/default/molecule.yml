---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: tinc-node1
    image: geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    networks:
      - name: tinc-network
  - name: tinc-node2
    image: geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    networks:
      - name: tinc-network
  - name: tinc-node3
    image: geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    networks:
      - name: tinc-network
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        tinc_debug_level: 2
        tinc_key_rotation_enabled: true
        tinc_key_rotation_days: 30
    host_vars:
      tinc-node1:
        bridge_ip: "172.20.0.11"
      tinc-node2:
        bridge_ip: "172.20.0.12"
      tinc-node3:
        bridge_ip: "172.20.0.13"
verifier:
  name: ansible
lint: |
  set -e
  yamllint .
  ansible-lint
scenario:
  name: default
  create_sequence:
    - create
  check_sequence:
    - create
    - converge
    - check
  converge_sequence:
    - create
    - prepare
    - converge
  destroy_sequence:
    - destroy
  test_sequence:
    - create
    - prepare
    - converge # install the role
    - verify
    - idempotence
    - verify
    - side_effect # run side effect playbook to trigger key rotation
    - converge # Rotate keys
    - verify
    - destroy