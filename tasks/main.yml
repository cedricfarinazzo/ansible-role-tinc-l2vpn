---
# ====================================================================
# 1. SET TINC HOSTNAME
# ====================================================================

- name: Set tinc hostname
  ansible.builtin.set_fact:
    tinc_node_name: >-
      {{
        tinc_hostname if tinc_hostname != ''
        else inventory_hostname | regex_replace('[^A-Za-z0-9_]', '_')
      }}

- name: Display tinc hostname mapping
  ansible.builtin.debug:
    msg: "Tinc hostname for {{ inventory_hostname }}: {{ tinc_node_name }}"

# ====================================================================
# 2. INSTALL PACKAGES
# ====================================================================

# Include tasks based on the operating system family
- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_os_family }}.yml"
    - "{{ ansible_distribution }}.yml"
    - default.yml
  tags:
    - always

- name: Install tinc package
  ansible.builtin.package:
    name: "{{ tinc_package }}"
    state: "{{ tinc_package_state }}"
  become: true
  notify: restart tinc
  ignore_errors: "{{ ansible_check_mode }}"

- name: Install network tools
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  with_items: "{{ required_packages }}"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"

# ====================================================================
# 3. CONFIGURE SYSTEM
# ====================================================================

- name: Enable IPv4 forwarding
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    regexp: '^net.ipv4.ip_forward'
    line: 'net.ipv4.ip_forward = 1'
    create: true
    mode: '0644'
  become: true
  notify: Reload sysctl

- name: Enable IPv6 forwarding
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    regexp: '^net.ipv6.conf.all.forwarding'
    line: 'net.ipv6.conf.all.forwarding = 1'
    create: true
    mode: '0644'
  become: true
  notify: Reload sysctl

# ====================================================================
# 4. CREATE FOLDERS
# ====================================================================

- name: Create tinc network directory
  ansible.builtin.file:
    path: "{{ tinc_config_path }}/{{ tinc_netname }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  become: true

- name: Create tinc network hosts directory
  ansible.builtin.file:
    path: "{{ tinc_config_path }}/{{ tinc_netname }}/hosts"
    state: directory
    mode: '0755'
    owner: root
    group: root
  become: true

- name: Create tinc backups directory
  ansible.builtin.file:
    path: "{{ tinc_config_path }}/{{ tinc_netname }}/backups"
    state: directory
    mode: '0600'
    owner: root
    group: root
  become: true
  when: tinc_key_rotation_enabled | bool

# ====================================================================
# 5. GENERATE SCRIPTS AND TINC.CONF
# ====================================================================

- name: Generate tinc network configuration
  ansible.builtin.template:
    src: tinc.conf.j2
    dest: "{{ tinc_config_path }}/{{ tinc_netname }}/tinc.conf"
    mode: '0644'
    owner: root
    group: root
  become: true
  notify: restart tinc

- name: Generate tinc-up script
  ansible.builtin.template:
    src: tinc-up.j2
    dest: "{{ tinc_config_path }}/{{ tinc_netname }}/tinc-up"
    mode: '0755'
    owner: root
    group: root
  become: true
  notify: restart tinc

- name: Generate tinc-down script
  ansible.builtin.template:
    src: tinc-down.j2
    dest: "{{ tinc_config_path }}/{{ tinc_netname }}/tinc-down"
    mode: '0755'
    owner: root
    group: root
  become: true
  notify: restart tinc

# ====================================================================
# 6. KEY GENERATION (when needed)
# ====================================================================

- name: Check private key age for rotation
  ansible.builtin.stat:
    path: "{{ tinc_config_path }}/{{ tinc_netname }}/rsa_key.priv"
  register: private_key_stat
  become: true

- name: Calculate key age in days
  ansible.builtin.set_fact:
    key_age_days: "{{ ((ansible_date_time.epoch | int) - (private_key_stat.stat.mtime | default(0))) // 86400 }}"
  when: private_key_stat.stat.exists

- name: Determine if key rotation is needed
  ansible.builtin.set_fact:
    rotation_needed: >-
      {{
        tinc_key_rotation_enabled | bool and
        private_key_stat.stat.exists and
        key_age_days | int >= tinc_key_rotation_days | int
      }}

- name: Log key rotation status
  ansible.builtin.debug:
    msg: >-
      Key rotation for {{ inventory_hostname }}:
      {% if private_key_stat.stat.exists %}
      Age={{ key_age_days }} days,
      Threshold={{ tinc_key_rotation_days }} days,
      Needed={{ rotation_needed }}
      {% else %}
      No existing key, will generate new one
      {% endif %}

# 6a. Create host config (before key generation so tinc knows where to put public key)
- name: Generate own host configuration file (before key generation)
  ansible.builtin.template:
    src: host.j2
    dest: "{{ tinc_config_path }}/{{ tinc_netname }}/hosts/{{ tinc_node_name }}"
    mode: '0644'
    owner: root
    group: root
  become: true
  vars:
    item: "{{ inventory_hostname }}"
    generate_header_only: true
  when: not private_key_stat.stat.exists or rotation_needed | bool

# 6b. Backup old files before rotation
- name: Backup old private key before rotation
  ansible.builtin.copy:
    src: "{{ tinc_config_path }}/{{ tinc_netname }}/rsa_key.priv"
    dest: "{{ tinc_config_path }}/{{ tinc_netname }}/backups/rsa_key.priv_{{ ansible_date_time.iso8601_basic_short }}"
    remote_src: true
    backup: false
    mode: "0600"
    owner: root
    group: root
  become: true
  when:
    - rotation_needed | bool
    - private_key_stat.stat.exists
  failed_when: false

- name: Backup old host file before rotation
  ansible.builtin.copy:
    src: "{{ tinc_config_path }}/{{ tinc_netname }}/hosts/{{ tinc_node_name }}"
    dest: >-
      {{ tinc_config_path }}/{{ tinc_netname }}/backups/{{ tinc_node_name }}_{{
      ansible_date_time.iso8601_basic_short }}
    remote_src: true
    backup: false
    mode: "0644"
    owner: root
    group: root
  become: true
  when:
    - rotation_needed | bool
    - private_key_stat.stat.exists
  failed_when: false

# 6c. Generate host keys (tinc will write public key directly to host file)
- name: Generate tinc key pair (initial or rotated)
  ansible.builtin.shell: |
    echo "" | tincd -n {{ tinc_netname }} -K4096
  become: true
  when: not private_key_stat.stat.exists or rotation_needed | bool
  register: key_generated
  args:
    chdir: "{{ tinc_config_path }}/{{ tinc_netname }}"
  changed_when: key_generated.rc == 0

- name: Set proper permissions on private key
  ansible.builtin.file:
    path: "{{ tinc_config_path }}/{{ tinc_netname }}/rsa_key.priv"
    mode: '0600'
    owner: root
    group: root
  become: true

- name: Log key generation
  ansible.builtin.debug:
    msg: >-
      {% if not private_key_stat.stat.exists %}
      Generated new key pair for {{ inventory_hostname }}
      {% elif rotation_needed | bool %}
      Rotated key pair for {{ inventory_hostname }} ({{ key_age_days }} days old)
      {% endif %}
  when: key_generated is changed

# ====================================================================
# 7. READ PUBLIC KEY FROM HOST FILE
# ====================================================================

- name: Read tinc public key from host file
  ansible.builtin.slurp:
    src: "{{ tinc_config_path }}/{{ tinc_netname }}/hosts/{{ tinc_node_name }}"
  register: tinc_host_file_encoded
  become: true

- name: Extract public key from host file
  ansible.builtin.set_fact:
    tinc_public_key: >-
      {{ tinc_host_file_encoded['content'] | b64decode
      | regex_search('-----BEGIN RSA PUBLIC KEY-----[\\s\\S]*?-----END RSA PUBLIC KEY-----') }}
  when: tinc_host_file_encoded is defined

# ====================================================================
# 8. SHARE WITH OTHER NODES
# ====================================================================

# Gather facts from all hosts for key exchange
- name: Gather facts from all hosts for key exchange
  ansible.builtin.setup:
  delegate_to: "{{ item }}"
  delegate_facts: true
  with_items: "{{ groups['all'] }}"
  run_once: true
  when: groups['all'] | length > 1
  ignore_errors: "{{ ansible_check_mode }}"

# Validate tinc hostname uniqueness across all hosts
- name: Check for duplicate tinc hostnames
  ansible.builtin.fail:
    msg: >-
      Duplicate tinc hostname detected: {{ hostvars[item]['tinc_node_name'] }}.
      Multiple inventory hostnames map to the same sanitized tinc hostname.
      Please set unique tinc_hostname variables for affected hosts.
      Affected hosts: >-
        {{ groups['all'] | select('extract', hostvars, 'tinc_node_name')
        | select('==', hostvars[item]['tinc_node_name']) | list }}
  when:
    - >-
      groups['all'] | map('extract', hostvars, 'tinc_node_name')
      | select('==', hostvars[item]['tinc_node_name']) | list | length > 1
  with_items: "{{ groups['all'] }}"
  run_once: true
  delegate_to: localhost

# Create host configuration files for all OTHER nodes in the mesh
- name: Generate host configuration files for other nodes
  ansible.builtin.template:
    src: host.j2
    dest: >-
      {{ tinc_config_path }}/{{ tinc_netname }}/hosts/{{
      hostvars[item]['tinc_hostname'] | default('') if hostvars[item]['tinc_hostname']
      | default('') != '' else item | regex_replace('[^A-Za-z0-9_]', '_') }}
    mode: '0644'
    owner: root
    group: root
  become: true
  with_items: "{{ groups['all'] }}"
  when:
    - item != inventory_hostname
    - hostvars[item]['tinc_public_key'] is defined
  notify: restart tinc

# ====================================================================
# 9. HANDLE SERVICE
# ====================================================================

# Configure network boot
- name: Add network to nets.boot
  ansible.builtin.lineinfile:
    path: "{{ tinc_networks_file }}"
    line: "{{ tinc_netname }}"
    create: true
    mode: '0644'
    owner: root
    group: root
  become: true

# Enable and start tinc service
- name: Enable and start tinc service
  ansible.builtin.service:
    name: "tinc@{{ tinc_netname }}"
    state: "{{ tinc_service_state }}"
    enabled: "{{ tinc_service_enabled }}"
  become: true
  register: tinc_service
  ignore_errors: "{{ ansible_check_mode }}"
